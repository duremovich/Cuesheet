<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Cuesheet</title>
    <script>
      // Pick the theme before first paint (keep in sync with src/web/lib/theme.ts):
      // the user's stored choice, otherwise dark. The system color scheme is ignored.
      (() => {
        var t = null;
        try {
          t = localStorage.getItem("cuesheet.theme");
        } catch (_e) {}
        if (t !== "light" && t !== "dark") t = "dark";
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
