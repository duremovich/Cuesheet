name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck, lint, unit + worker tests
        run: pnpm check
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      # 3 workers (playwright.config.ts) on the 4-core runner; the 4th core runs workerd.
      # One retry for a second trace, but a test that only passes on retry still fails the
      # run (failOnFlakyTests).
      - name: End-to-end tests
        run: pnpm e2e
      # Traces are kept for failed tests only (trace: retain-on-failure) and land in
      # test-results/; open one with `pnpm exec playwright show-trace <trace.zip>`.
      - name: Upload Playwright report and traces
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
