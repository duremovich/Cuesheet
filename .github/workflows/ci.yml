name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  check:
    runs-on: ubuntu-24.04 # pinned: Playwright 1.56 has no chromium for ubuntu-latest (26.04)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck, lint, unit + worker tests
        run: pnpm check
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      # 3 workers (playwright.config.ts) on the 4-core runner; the 4th core runs workerd.
      # One retry for a second trace, but a test that only passes on retry still fails the
      # run (failOnFlakyTests).
      - name: End-to-end tests (probe x3)
        run: |
          mkdir -p probe
          bash scripts/ci-probe.sh probe &
          for i in 1 2 3 4 5 6; do
            if [ $((i % 2)) -eq 0 ]; then export E2E_STATE_DIR=/dev/shm/cuesheet-e2e; else export E2E_STATE_DIR=.wrangler/e2e-state-4317; fi
            export REQUEST_LOG_DIR=$PWD/probe/run$i
            echo "=== RUN $i $E2E_STATE_DIR $(date -u +%T)"; pnpm e2e || true
          done 2>&1 | tee probe/e2e.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: probe/
      # Traces are kept for failed tests only (trace: retain-on-failure) and land in
      # test-results/; open one with `pnpm exec playwright show-trace <trace.zip>`.
      - name: Upload Playwright report and traces
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
